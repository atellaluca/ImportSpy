name: Set up ImportSpy
description: Install the locked development environment
inputs:
  python-version:
    description: Python version under test
    default: "3.13"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Poetry
      shell: bash
      run: pipx install --force poetry==2.4.0
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .venv
        key: importspy-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}
    - name: Install locked dependencies
      shell: bash
      env:
        POETRY_VIRTUALENVS_IN_PROJECT: "true"
      run: poetry sync --with dev --no-interaction
