name: CI (Poetry)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: poetry run ruff check src tests scripts examples/admission

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: poetry run mypy src

  test-matrix:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python }}
      - run: poetry run pytest -q
      - name: Dogfood configured admission
        run: poetry run importspy check . --format json

  tests:
    name: tests
    if: always()
    needs: test-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require every supported Python version
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: test "$MATRIX_RESULT" = success

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - run: poetry check --strict
      - run: poetry run mkdocs build --strict
      - run: poetry build
      - name: Verify installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/importspy-smoke"
          "$RUNNER_TEMP/importspy-smoke/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/importspy-smoke/bin/python" scripts/smoke_package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: importspy-distributions
          path: dist/
          if-no-files-found: error
