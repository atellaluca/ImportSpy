version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    post_create_environment:
      - pip install poetry==2.4.0
    post_install:
      - poetry config virtualenvs.create false
      - poetry install --with dev --no-interaction
mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
