site_name: ImportSpy
site_url: https://importspy.atellaluca.com/
repo_url: https://github.com/atellaluca/importspy
repo_name: atellaluca/ImportSpy

theme:
  name: material
  custom_dir: docs/overrides
  favicon: assets/favicon.ico
  logo: assets/importspy-logo.png

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy

exclude_docs: |
  /build/

nav:
  - Home: index.md
  - Get started:
      - Overview: intro/overview.md
      - Installation: intro/install.md
      - Quickstart: intro/quickstart.md
      - CLI: modes/cli.md
      - Library and loading: modes/embedded.md
  - Admission:
      - Architecture: architecture.md
      - Static preflight: static-preflight.md
      - Contract syntax: contracts/syntax.md
      - Contract examples: contracts/examples.md
      - Dependencies: dependencies.md
      - Evidence: evidence.md
      - Supply chain: supply-chain.md
      - Security and limitations: security-model.md
  - Integrate and extend:
      - Extensions: extensions.md
      - CI and GitHub Actions: ci.md
      - Use cases: use_cases/index.md
      - Community roadmap: community-roadmap.md
  - Reference:
      - API: api-reference.md
      - Violations: errors/contract-violations.md
      - Decision model: advanced/violations.md
      - Legacy SpyModel: advanced/spymodel.md
      - Migration from 0.4: migration-0.5.md
      - Release engineering: release.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: false

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.tabbed:
      alternate_style: true

