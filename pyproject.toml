[project]
name = "importspy"
version = "0.5.0"
description = "Policy-as-code admission for Python modules and dependencies."
license = "MIT"
authors = [{name = "Luca Atella", email = "info@atellaluca.com"}]
readme = "README.md"
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9.2,<3",
    "ruamel-yaml>=0.18.10,<0.20.0",
    "typer>=0.15.2,<0.16",
    "packaging>=24.0",
    "tomli>=2; python_version < '3.11'",
    "importlib-metadata>=8; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/atellaluca/ImportSpy"
Documentation = "https://importspy.readthedocs.io"
Issues = "https://github.com/atellaluca/ImportSpy/issues"

[project.scripts]
importspy = "importspy.cli:main"

[tool.poetry]
packages = [{include = "importspy", from = "src"}]

[tool.poetry.group.dev.dependencies]
pymdown-extensions = ">=11.0.1,<12"
tomli = ">=2"
importlib-metadata = ">=8"
pytest = "^8.3.3"
mkdocs = "^1.6.1"
mkdocstrings = {version = "^1.0.6", extras = ["python"]}
mkdocs-material = "^9.6.16"
ruff = "^0.12.10"
mypy = "^1.17.1"
pytest-cov = "^6.2.1"
build = "^1.3.0"

[build-system]
requires = ["poetry-core>=2.2,<3"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"

[tool.importspy]
subjects = [{path = "src/importspy/domain.py", contract = "contracts/importspy-domain.yml"}]
